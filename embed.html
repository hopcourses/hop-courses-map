<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hop Courses - Suivi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Fonction pour gérer les virgules ou les points dans les coordonnées
        function parseCoord(val) {
            if (!val) return NaN;
            return parseFloat(val.toString().replace(',', '.'));
        }

        const params = new URLSearchParams(window.location.search);
        const latA = parseCoord(params.get('latA'));
        const lngA = parseCoord(params.get('lngA'));
        const latB = parseCoord(params.get('latB'));
        const lngB = parseCoord(params.get('lngB'));

        const map = L.map('map', {
            zoomControl: true,
            attributionControl: true,
            zoomSnap: 0.25,
            zoomDelta: 0.25
        }).setView([50.7333, 2.7333], 13); // Centré par défaut vers Bailleul

        // Fond de carte OpenStreetMap Gratuit
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

        const boundsMarkers = [];

        // 1. Point A (Départ - Bleu foncé)
        if (!isNaN(latA) && latA !== 0 && !isNaN(lngA) && lngA !== 0) {
            const iconA = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #003366; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latA, lngA], { icon: iconA }).addTo(map);
            boundsMarkers.push([latA, lngA]);
        }

        // 2. Point B (Destination - Orange)
        if (!isNaN(latB) && latB !== 0 && !isNaN(lngB) && lngB !== 0) {
            const iconB = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #FF9100; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latB, lngB], { icon: iconB }).addTo(map);
            boundsMarkers.push([latB, lngB]);
        }

        // 3. Tracé en ligne droite et Animation
        if (!isNaN(latA) && latA !== 0 && !isNaN(latB) && latB !== 0) {
            
            const pointCollecte = [latA, lngA];
            const pointLivraison = [latB, lngB];
            const routeCoords = [pointCollecte, pointLivraison];

            // Tracé de la ligne droite en pointillés
            L.polyline(routeCoords, { 
                color: '#003366', 
                weight: 4, 
                opacity: 0.7, 
                dashArray: '8, 8' 
            }).addTo(map);

            // Calcul natif de la distance à vol d'oiseau (Leaflet)
            const distMetres = map.distance(pointCollecte, pointLivraison);
            const distanceKm = (distMetres / 1000).toFixed(1);

            // Icône animée personnalisée avec la distance
            const iconLivreurAnime = L.divIcon({
                className: "",
                html: `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;">
                        <div style="background: #003366; color: white; font-size: 11px; font-weight: bold; font-family: sans-serif; padding: 2px 7px; border-radius: 10px; border: 1px solid #00D26A; box-shadow: 0 2px 6px rgba(0,0,0,0.3); white-space: nowrap; margin-bottom: 2px;">
                            ${distanceKm} km
                        </div>
                        <div style="font-size: 26px; line-height: 26px; text-align: center; transform: scaleX(-1); filter: drop-shadow(-2px 3px 4px rgba(0,0,0,0.4));">⚲</div>
                    </div>
                `,
                iconSize: [60, 50],
                iconAnchor: [30, 42]
            });

            const animatedMarker = L.marker(routeCoords[0], { icon: iconLivreurAnime }).addTo(map);

            // Animation ultra-fluide sur la ligne droite
            let step = 0;
            function moveCursor() {
                step += 0.001; // Vitesse de l'animation : ajuste ce chiffre si ça va trop vite ou trop lentement
                
                if (step >= 1) {
                    step = 0; // Recommence l'animation
                }

                // Interpolation linéaire entre A et B
                const currentLat = pointCollecte[0] + (pointLivraison[0] - pointCollecte[0]) * step;
                const currentLng = pointCollecte[1] + (pointLivraison[1] - pointCollecte[1]) * step;

                animatedMarker.setLatLng([currentLat, currentLng]);
                requestAnimationFrame(moveCursor);
            }
            requestAnimationFrame(moveCursor);
        }

        // 4. Cadrage automatique de la carte (Zoom limité à 16)
        if (boundsMarkers.length > 0) {
            const group = L.featureGroup(boundsMarkers.map(coords => L.marker(coords)));
            map.fitBounds(group.getBounds(), {
                animate: true,
                duration: 0.8,
                paddingTopLeft: [20, 80],
                paddingBottomRight: [20, 80],
                maxZoom: 12
            });
        }
    </script>
</body>
</html>
