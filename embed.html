<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hop Courses - Suivi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        /* Style du panonceau de distance */
        .distance-badge {
            background-color: #003366;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Fonction pour gérer les virgules ou les points dans les coordonnées
        function parseCoord(val) {
            if (!val) return NaN;
            return parseFloat(val.toString().replace(',', '.'));
        }

        const params = new URLSearchParams(window.location.search);
        const latA = parseCoord(params.get('latA'));
        const lngA = parseCoord(params.get('lngA'));
        const latB = parseCoord(params.get('latB'));
        const lngB = parseCoord(params.get('lngB'));
        const latLivreur = parseCoord(params.get('latLivreur'));
        const lngLivreur = parseCoord(params.get('lngLivreur'));

        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const boundsMarkers = [];

        // 1. Point A (Départ - Bleu foncé - FIXE)
        if (!isNaN(latA) && latA !== 0 && !isNaN(lngA) && lngA !== 0) {
            const iconA = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #003366; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latA, lngA], { icon: iconA }).addTo(map).bindPopup("<b>Adresse de départ</b>");
            boundsMarkers.push([latA, lngA]);
        }

        // 2. Point B (Destination - Orange - FIXE)
        if (!isNaN(latB) && latB !== 0 && !isNaN(lngB) && lngB !== 0) {
            const iconB = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #FF9100; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latB, lngB], { icon: iconB }).addTo(map).bindPopup("<b>Adresse de destination</b>");
            boundsMarkers.push([latB, lngB]);
        }

        // 3. Position du Livreur (Vert - Plus petit - Totalement FIXE)
        if (!isNaN(latLivreur) && latLivreur !== 0 && !isNaN(lngLivreur) && lngLivreur !== 0) {
            const iconLivreur = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #10B981; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            L.marker([latLivreur, lngLivreur], { icon: iconLivreur }).addTo(map).bindPopup("<b>📍 Votre position actuelle</b>");
            boundsMarkers.push([latLivreur, lngLivreur]);
        }

        // 4. Ligne, Panonceau et Animation du curseur
        if (!isNaN(latA) && latA !== 0 && !isNaN(latB) && latB !== 0) {
            const latlngA = L.latLng(latA, lngA);
            const latlngB = L.latLng(latB, lngB);

            // Tracé en pointillés
            L.polyline([latlngA, latlngB], { 
                color: '#003366', 
                weight: 4, 
                opacity: 0.7, 
                dashArray: '6, 6' 
            }).addTo(map);

            // Panonceau de distance
            const distanceKm = (latlngA.distanceTo(latlngB) / 1000).toFixed(1);
            const midpoint = [(latA + latB) / 2, (lngA + lngB) / 2];

            const distanceIcon = L.divIcon({
                className: '',
                html: `<div class="distance-badge">${distanceKm} km</div>`,
                iconSize: [70, 24],
                iconAnchor: [35, 12]
            });
            L.marker(midpoint, { icon: distanceIcon }).addTo(map);

            // 5. Curseur d'animation (Épingle noire en SVG calquée sur ta capture)
            const iconAnim = L.divIcon({
                className: 'custom-pin',
                html: `<svg width="16" height="22" viewBox="0 0 16 22" xmlns="http://www.w3.org/2000/svg">
                           <circle cx="8" cy="8" r="6" fill="transparent" stroke="black" stroke-width="2.5"/>
                           <line x1="8" y1="14" x2="8" y2="22" stroke="black" stroke-width="2.5"/>
                       </svg>`,
                iconSize: [16, 22],
                iconAnchor: [8, 22] // Le point d'ancrage est exactement au bout de la tige
            });
            
            const animatedMarker = L.marker([latA, lngA], { icon: iconAnim }).addTo(map);

            let progress = 0;
            function moveCursor() {
                progress += 0.002;
                if (progress > 1) progress = 0;

                const currentLat = latA + (latB - latA) * progress;
                const currentLng = lngA + (lngB - lngA) * progress;
                
                animatedMarker.setLatLng([currentLat, currentLng]);
                requestAnimationFrame(moveCursor);
            }
            requestAnimationFrame(moveCursor);
        }

        // 6. Cadrage automatique de la carte
        if (boundsMarkers.length > 0) {
            const group = L.featureGroup(boundsMarkers.map(coords => L.marker(coords)));
            map.fitBounds(group.getBounds().pad(0.3));
        }
    </script>
</body>
</html>
