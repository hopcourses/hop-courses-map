<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hop Courses - Suivi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        /* Style du panonceau de distance */
        .distance-badge {
            background-color: #003366;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Fonction pour gérer les virgules ou les points dans les coordonnées
        function parseCoord(val) {
            if (!val) return NaN;
            return parseFloat(val.toString().replace(',', '.'));
        }

        const params = new URLSearchParams(window.location.search);
        const latA = parseCoord(params.get('latA'));
        const lngA = parseCoord(params.get('lngA'));
        const latB = parseCoord(params.get('latB'));
        const lngB = parseCoord(params.get('lngB'));
        const latLivreur = parseCoord(params.get('latLivreur'));
        const lngLivreur = parseCoord(params.get('lngLivreur'));

        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const boundsMarkers = [];

        // 1. Point A (Départ - Bleu foncé - FIXE)
        if (!isNaN(latA) && latA !== 0 && !isNaN(lngA) && lngA !== 0) {
            const iconA = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #003366; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latA, lngA], { icon: iconA }).addTo(map).bindPopup("<b>Adresse de départ</b>");
            boundsMarkers.push([latA, lngA]);
        }

        // 2. Point B (Destination - Orange - FIXE)
        if (!isNaN(latB) && latB !== 0 && !isNaN(lngB) && lngB !== 0) {
            const iconB = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #FF9100; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latB, lngB], { icon: iconB }).addTo(map).bindPopup("<b>Adresse de destination</b>");
            boundsMarkers.push([latB, lngB]);
        }

        // 3. Position du Livreur (Vert - Plus petit - Totalement FIXE)
        if (!isNaN(latLivreur) && latLivreur !== 0 && !isNaN(lngLivreur) && lngLivreur !== 0) {
            const iconLivreur = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #10B981; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            L.marker([latLivreur, lngLivreur], { icon: iconLivreur }).addTo(map).bindPopup("<b>📍 Votre dernière position enregistrée</b>");
            boundsMarkers.push([latLivreur, lngLivreur]);
        }

        // 4 & 5. Ligne, Panonceau et Animation (AVEC OSRM ROUTING - TRACÉ PAR LES RUES)
        if (!isNaN(latA) && latA !== 0 && !isNaN(latB) && latB !== 0) {
            
            // On prépare l'URL pour interroger le GPS gratuit OSRM (attention, OSRM lit Longitude puis Latitude)
            const urlOSRM = `https://router.project-osrm.org/route/v1/driving/${lngA},${latA};${lngB},${latB}?overview=full&geometries=geojson`;

            // On lance la requête au serveur
            fetch(urlOSRM)
                .then(response => response.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        const route = data.routes[0];
                        
                        // OSRM renvoie un tableau de coordonnées [lng, lat]. On les inverse en [lat, lng] pour Leaflet.
                        const routeCoords = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);

                        // Tracé en pointillés qui suit exactement les rues
                        L.polyline(routeCoords, { 
                            color: '#003366', 
                            weight: 4, 
                            opacity: 0.7, 
                            dashArray: '6, 6' 
                        }).addTo(map);

                        // Panonceau de distance (On utilise la VRAIE distance routière renvoyée par le GPS)
                        const distanceKm = (route.distance / 1000).toFixed(1);
                        
                        // On place le badge exactement au milieu du chemin tracé (sur la route !)
                        const midIndex = Math.floor(routeCoords.length / 2);
                        const distanceIcon = L.divIcon({
                            className: '',
                            html: `<div class="distance-badge">${distanceKm} km</div>`,
                            iconSize: [70, 24],
                            iconAnchor: [35, 12]
                        });
                        L.marker(routeCoords[midIndex], { icon: distanceIcon }).addTo(map);

                        // Curseur d'animation (qui va suivre les courbes de la route)
                        const iconAnim = L.divIcon({
                            className: 'custom-pin',
                            html: `<svg width="16" height="22" viewBox="0 0 16 22" xmlns="http://www.w3.org/2000/svg">
                                       <circle cx="8" cy="8" r="6" fill="transparent" stroke="black" stroke-width="2.5"/>
                                       <line x1="8" y1="14" x2="8" y2="22" stroke="black" stroke-width="2.5"/>
                                   </svg>`,
                            iconSize: [16, 22],
                            iconAnchor: [8, 22]
                        });
                        
                        const animatedMarker = L.marker(routeCoords[0], { icon: iconAnim }).addTo(map);

                        let step = 0;
                        function moveCursor() {
                            step += 0.2; // VITESSE: Modifie ce chiffre pour accélérer ou ralentir l'animation (ex: 0.1 ou 0.5)
                            let index = Math.floor(step);
                            
                            // On recommence au début quand on arrive à destination
                            if (index >= routeCoords.length - 1) {
                                step = 0;
                                index = 0;
                            }

                            // Interpolation douce pour que l'épingle glisse parfaitement entre les virages
                            const p1 = routeCoords[index];
                            const p2 = routeCoords[index + 1];
                            const fraction = step - index;
                            
                            const currentLat = p1[0] + (p2[0] - p1[0]) * fraction;
                            const currentLng = p1[1] + (p2[1] - p1[1]) * fraction;

                            animatedMarker.setLatLng([currentLat, currentLng]);
                            requestAnimationFrame(moveCursor);
                        }
                        requestAnimationFrame(moveCursor);
                    }
                })
                .catch(error => console.error("Erreur lors du tracé de la route:", error));
        }

       // 6. Cadrage automatique de la carte (Retour à ton code d'origine)
        if (boundsMarkers.length > 0) {
            const group = L.featureGroup(boundsMarkers.map(coords => L.marker(coords)));
            
            // On utilise ta méthode d'origine (pad), mais on limite le zoom maximum à 15
            map.fitBounds(group.getBounds().pad(0.1), {
                maxZoom: 15
            });
        }
    </script>
</body>
</html>
