<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte Hop Courses - Suivi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        .distance-badge {
            background-color: #003366;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }
        .driver-badge {
            background-color: #10B981;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const latA = parseFloat(params.get('latA'));
        const lngA = parseFloat(params.get('lngA'));
        const latB = parseFloat(params.get('latB'));
        const lngB = parseFloat(params.get('lngB'));
        const latLivreur = parseFloat(params.get('latLivreur'));
        const lngLivreur = parseFloat(params.get('lngLivreur'));

        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const boundsMarkers = [];

        // Point A (Collecte - #003366)
        if (!isNaN(latA) && latA !== 0 && !isNaN(lngA) && lngA !== 0) {
            const iconA = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #003366; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latA, lngA], { icon: iconA }).addTo(map).bindPopup("<b>Collecte</b>");
            boundsMarkers.push([latA, lngA]);
        }

        // Point B (Destination - #FF9100)
        if (!isNaN(latB) && latB !== 0 && !isNaN(lngB) && lngB !== 0) {
            const iconB = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #FF9100; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latB, lngB], { icon: iconB }).addTo(map).bindPopup("<b>Destination</b>");
            boundsMarkers.push([latB, lngB]);
        }

        // Position du Livreur
        if (!isNaN(latLivreur) && latLivreur !== 0 && !isNaN(lngLivreur) && lngLivreur !== 0) {
            const iconLivreur = L.divIcon({
                className: '',
                html: '<div class="driver-badge">🚗 Livreur</div>',
                iconSize: [70, 26],
                iconAnchor: [35, 13]
            });
            L.marker([latLivreur, lngLivreur], { icon: iconLivreur }).addTo(map).bindPopup("<b>Position du livreur</b>");
            boundsMarkers.push([latLivreur, lngLivreur]);
        }

        // Ligne et Panonceau de Distance entre A et B
        if (!isNaN(latA) && latA !== 0 && !isNaN(latB) && latB !== 0) {
            const latlngA = L.latLng(latA, lngA);
            const latlngB = L.latLng(latB, lngB);

            L.polyline([latlngA, latlngB], { 
                color: '#003366', 
                weight: 4, 
                opacity: 0.7, 
                dashArray: '6, 6' 
            }).addTo(map);

            const distanceKm = (latlngA.distanceTo(latlngB) / 1000).toFixed(1);
            const midpoint = [(latA + latB) / 2, (lngA + lngB) / 2];

            const distanceIcon = L.divIcon({
                className: '',
                html: `<div class="distance-badge">${distanceKm} km</div>`,
                iconSize: [70, 24],
                iconAnchor: [35, 12]
            });
            L.marker(midpoint, { icon: distanceIcon }).addTo(map);
        }

        if (boundsMarkers.length > 0) {
            const group = L.featureGroup(boundsMarkers.map(coords => L.marker(coords)));
            map.fitBounds(group.getBounds().pad(0.3));
        }
    </script>
</body>
</html>
