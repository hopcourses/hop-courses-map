<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hop Courses - Suivi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        /* Style du panonceau de distance */
        .distance-badge {
            background-color: #003366;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Fonction pour gérer les virgules ou les points dans les coordonnées
        function parseCoord(val) {
            if (!val) return NaN;
            return parseFloat(val.toString().replace(',', '.'));
        }

        const params = new URLSearchParams(window.location.search);
        const latA = parseCoord(params.get('latA'));
        const lngA = parseCoord(params.get('lngA'));
        const latB = parseCoord(params.get('latB'));
        const lngB = parseCoord(params.get('lngB'));
        const latLivreur = parseCoord(params.get('latLivreur'));
        const lngLivreur = parseCoord(params.get('lngLivreur'));

        const map = L.map('map', {
            zoomControl: true,
            attributionControl: true,
            zoomSnap: 0.25,
            zoomDelta: 0.25
        }).setView([48.8566, 2.3522], 13);

        // Intégration du fond de carte MapTiler Landscape (Optimisé mobile 512x512)
        L.tileLayer('https://api.maptiler.com/maps/landscape-v4/{z}/{x}/{y}.png?key=TA_CLE_API_MAPTILER', {
            maxZoom: 19,
            tileSize: 512,
            zoomOffset: -1,
            attribution: '© MapTiler © OpenStreetMap contributors'
        }).addTo(map);

        const boundsMarkers = [];

        // 1. Point A (Départ - Bleu foncé - FIXE)
        if (!isNaN(latA) && latA !== 0 && !isNaN(lngA) && lngA !== 0) {
            const iconA = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #003366; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latA, lngA], { icon: iconA }).addTo(map).bindPopup("<b>Adresse de départ</b>");
            boundsMarkers.push([latA, lngA]);
        }

        // 2. Point B (Destination - Orange - FIXE)
        if (!isNaN(latB) && latB !== 0 && !isNaN(lngB) && lngB !== 0) {
            const iconB = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #FF9100; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            L.marker([latB, lngB], { icon: iconB }).addTo(map).bindPopup("<b>Adresse de destination</b>");
            boundsMarkers.push([latB, lngB]);
        }

        // 3. Position du Livreur (Optionnel si tu veux la garder ou l'enlever)
        if (!isNaN(latLivreur) && latLivreur !== 0 && !isNaN(lngLivreur) && lngLivreur !== 0) {
            const iconLivreur = L.divIcon({
                className: 'custom-pin',
                html: '<div style="background-color: #10B981; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            L.marker([latLivreur, lngLivreur], { icon: iconLivreur }).addTo(map).bindPopup("<b>📍 Votre position</b>");
            boundsMarkers.push([latLivreur, lngLivreur]);
        }

        // 4. Tracé OSRM (Par les rues) + Panonceau de distance au milieu
        if (!isNaN(latA) && latA !== 0 && !isNaN(latB) && latB !== 0) {
            const urlOSRM = `https://router.project-osrm.org/route/v1/driving/${lngA},${latA};${lngB},${latB}?overview=full&geometries=geojson`;

            fetch(urlOSRM)
                .then(response => response.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        const route = data.routes[0];
                        const routeCoords = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);

                        // Ligne de l'itinéraire
                        L.polyline(routeCoords, { 
                            color: '#FF9100', 
                            weight: 4, 
                            opacity: 0.7, 
                            dashArray: '8, 8' 
                        }).addTo(map);

                        // Panonceau de distance au milieu
                        const distanceKm = (route.distance / 1000).toFixed(1);
                        const midIndex = Math.floor(routeCoords.length / 2);
                        const distanceIcon = L.divIcon({
                            className: '',
                            html: `<div class="distance-badge">${distanceKm} km</div>`,
                            iconSize: [70, 24],
                            iconAnchor: [35, 12]
                        });
                        L.marker(routeCoords[midIndex], { icon: distanceIcon }).addTo(map);
                    }
                })
                .catch(error => console.error("Erreur lors du tracé de la route:", error));
        }

        // 5. Cadrage automatique fluide et ajusté aux petits écrans
        if (boundsMarkers.length > 0) {
            const group = L.featureGroup(boundsMarkers.map(coords => L.marker(coords)));
            map.fitBounds(group.getBounds(), {
                animate: true,
                duration: 0.8,
                paddingTopLeft: [20, 20],
                paddingBottomRight: [20, 20],
                maxZoom: 16
            });
        }
    </script>
</body>
</html>
